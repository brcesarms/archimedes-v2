# ==============================================================================
# 🏛️ Archimedes V2 — Configuração do Lychee (Link Checker em Rust)
# ==============================================================================

timeout = 5
max_retries = 2
max_concurrency = 8
include_mail = false

exclude_path = [
  ".git",
  ".venv",
  "node_modules",
  ".claude-mem",
  ".planning",
  ".cache"
]

exclude = [
  '^https://opencode\.ai/config\.schema\.json',
  '^https://json-schema\.org',
  '^conversation://',
  '^file://',
  '^http://localhost',
  '^http://127\.0\.0\.1'
]
