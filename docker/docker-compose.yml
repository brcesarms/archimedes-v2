# ============================================================
# 🐳 Docker Compose do Archimedes - Stack de IA Local
# ============================================================
# Padrão de Indústria: Ollama (runtime) + Open-WebUI (interface web)
# Compatível com: Docker Compose v2.20+
#
# Uso:
#   cd docker
#   docker compose up -d             # Iniciar serviços (Ollama + Open-WebUI)
#   docker compose ps                # Verificar saúde
# ============================================================

services:
  # 🦙 Ollama - Runtime e Servidor de Inferência de Modelos de IA
  ollama:
    image: ollama/ollama:latest
    container_name: archimedes-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=2h
    # 🎮 GPU NVIDIA (ex: Alienware com GeForce RTX 5060)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/11434 && printf \"GET /api/tags HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 🌐 Open-WebUI - Interface Web Amigável Padrão de Indústria para LLMs
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: archimedes-open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # 🔒 Segredo NUNCA versionado — defina no arquivo local .env (ver .env.example)
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Defina WEBUI_SECRET_KEY no arquivo .env}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
    name: archimedes-ollama-data
  open-webui-data:
    name: archimedes-open-webui-data